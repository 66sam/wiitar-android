name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign the release APK with the real key when the secrets are available (pushes to this
      # repo, not forks), so test builds install over a released copy.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.WIITAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WIITAR_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test protocol layer and build APKs
        env:
          WIITAR_KEYSTORE_PASSWORD: ${{ secrets.WIITAR_KEYSTORE_PASSWORD }}
          WIITAR_KEY_ALIAS: ${{ secrets.WIITAR_KEY_ALIAS }}
          WIITAR_KEY_PASSWORD: ${{ secrets.WIITAR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :protocol:test :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wiitar-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wiitar-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: protocol/build/reports/tests/
