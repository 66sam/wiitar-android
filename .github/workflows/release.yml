name: Release

# Run from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Creates a draft GitHub release with the APK; publish it from the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Secrets: WIITAR_KEYSTORE_BASE64, WIITAR_KEYSTORE_PASSWORD, WIITAR_KEY_ALIAS,
      # WIITAR_KEY_PASSWORD. Releases must not use the public debug key, so they're required.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.WIITAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WIITAR_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::Release key secrets are missing (see README, Building)."
            exit 1
          fi

      - name: Test and build
        env:
          WIITAR_KEYSTORE_PASSWORD: ${{ secrets.WIITAR_KEYSTORE_PASSWORD }}
          WIITAR_KEY_ALIAS: ${{ secrets.WIITAR_KEY_ALIAS }}
          WIITAR_KEY_PASSWORD: ${{ secrets.WIITAR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :protocol:test :app:assembleRelease

      - name: Version
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          version=$(basename "$apk" | sed -E 's/^wiitar-(.*)-release\.apk$/\1/')
          cp "$apk" "wiitar-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Wiitar ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: true
          files: wiitar-${{ env.VERSION }}.apk
